<template>
    <lightning-card title={resolvedCardTitle} icon-name={cardIcon}>
        <span slot="actions" class="slds-badge slds-badge_lightest">
            <lightning-icon icon-name="utility:sparkles" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>{labels.mockBadge}
        </span>
        <div class="slds-grid slds-wrap slds-p-horizontal_medium">
            <!-- LEFT: human context -->
            <div class="slds-size_1-of-1 slds-large-size_1-of-2 slds-p-right_medium slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="utility:user_role" size="x-small" class="slds-m-right_x-small"></lightning-icon>{labels.humanContext}
                </h3>

                <p class="slds-text-title_caps slds-m-bottom_x-small">{labels.attachments}</p>
                <button type="button" class="dropzone slds-grid slds-grid_vertical slds-grid_align-center slds-grid_vertical-align-center slds-p-around_large" onclick={handleDropzoneClick}>
                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                    <span class="slds-text-body_regular slds-m-top_x-small">{labels.dropzone}</span>
                    <span class="slds-text-body_small slds-text-color_weak">{labels.dropzoneHint}</span>
                </button>
                <template lwc:if={hasFiles}>
                    <ul class="slds-m-top_small">
                        <template for:each={files} for:item="f">
                            <li key={f.id} class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                <lightning-icon icon-name="utility:image" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-col slds-truncate">{f.name}</span>
                                <lightning-button-icon icon-name="utility:close" variant="bare" size="small" alternative-text={labels.removeFile} data-id={f.id} onclick={handleRemoveFile}></lightning-button-icon>
                            </li>
                        </template>
                    </ul>
                </template>

                <div class="slds-m-top_medium">
                    <lightning-textarea label={labels.transcript} placeholder={labels.transcriptPlaceholder} value={transcript} onchange={handleTranscript} max-length="20000"></lightning-textarea>
                </div>
            </div>

            <!-- RIGHT: assistant -->
            <div class="slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="utility:einstein" size="x-small" class="slds-m-right_x-small"></lightning-icon>{labels.assistant}
                </h3>

                <div class="tile slds-p-around_medium slds-m-bottom_small">
                    <p class="slds-text-heading_small">{labels.notesTileTitle}</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-vertical_x-small">{labels.notesTileBody}</p>
                    <lightning-button variant="brand" label={generateLabel} icon-name="utility:magicwand" disabled={isGenerating} onclick={handleGenerate}></lightning-button>
                    <template lwc:if={isGenerating}>
                        <div class="slds-is-relative slds-m-top_large slds-p-vertical_large">
                            <lightning-spinner alternative-text={labels.generating} size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:if={notesReady}>
                        <div class="result slds-m-top_small slds-p-around_small">
                            <p class="slds-text-title_caps slds-m-bottom_x-small">{labels.notesResult}</p>
                            <template for:each={notesBlocks} for:item="b">
                                <template lwc:if={b.isHeading}>
                                    <h4 key={b.key} class="slds-text-heading_small slds-m-top_small">{b.text}</h4>
                                </template>
                                <template lwc:elseif={b.isBullet}>
                                    <p key={b.key} class="slds-m-left_small slds-m-top_xx-small">&bull; {b.text}</p>
                                </template>
                                <template lwc:else>
                                    <p key={b.key}>{b.text}</p>
                                </template>
                            </template>
                        </div>
                    </template>
                </div>

                <div class="tile slds-p-around_medium">
                    <p class="slds-text-heading_small">{labels.activitiesTileTitle}</p>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-vertical_x-small">{labels.activitiesTileBody}</p>
                    <lightning-button variant="brand" label={createLabel} icon-name="utility:checkin" disabled={isCreateDisabled} onclick={handleCreate}></lightning-button>
                    <template lwc:if={isCreating}>
                        <div class="slds-is-relative slds-m-top_large slds-p-vertical_large">
                            <lightning-spinner alternative-text={labels.creating} size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:if={activitiesReady}>
                        <div class="result slds-m-top_small slds-p-around_small">
                            <p class="slds-text-title_caps slds-m-bottom_x-small">{labels.activitiesResult}</p>
                            <ul>
                                <template for:each={activityRows} for:item="a">
                                    <li key={a.key} class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                                        <lightning-icon icon-name={a.icon} size="x-small" class="slds-m-right_small"></lightning-icon>
                                        <div class="slds-col">
                                            <p class="slds-text-body_regular">{a.subject}</p>
                                            <p class="slds-text-body_small slds-text-color_weak">{a.typeLabel} &middot; {a.due}</p>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
