<template>
    <lightning-card title={resolvedCardTitle} icon-name={cardIcon}>
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center">
            <lightning-button-icon icon-name="utility:refresh" alternative-text={labels.refresh} variant="border-filled" size="small" class="slds-m-right_xx-small" onclick={handleRefresh}></lightning-button-icon>
            <lightning-button-icon icon-name="utility:add" alternative-text={labels.newEvent} variant="border-filled" size="small" onclick={handleNewEvent}></lightning-button-icon>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={hasTypeToggles}>
                <div class="type-toggles slds-m-bottom_x-small">
                    <template for:each={typeToggles} for:item="t">
                        <button type="button" key={t.key} class={t.chipClass} style={t.style} data-key={t.key} onclick={handleTypeToggle}>
                            <span class="type-chip-dot"></span>{t.label}
                        </button>
                    </template>
                </div>
            </template>

            <template if:false={hasAnyEvent}>
                <p class="slds-text-align_center slds-text-color_weak slds-m-vertical_medium">{resolvedEmptyState}</p>
            </template>

            <template if:true={hasAllDayEvents}>
                <div class="allday-band slds-m-bottom_small">
                    <div class="allday-label slds-text-title_caps">{labels.allDay}</div>
                    <template for:each={allDayEvents} for:item="e">
                        <div class="allday-pill" key={e.id} style={e.style} data-id={e.id} onclick={navigateToRecord}>
                            <span class="slds-truncate">{e.subject}</span>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={hasTimelineEvents}>
                <div class="timeline" style={timelineStyle}>
                    <template for:each={hourMarks} for:item="h">
                        <div class="hour-line" key={h.key} style={h.style}>
                            <span class="hour-label">{h.label}</span>
                        </div>
                    </template>

                    <div class="now-line" style={nowLineStyle}>
                        <span class="now-label">{nowLabel}</span>
                    </div>

                    <div class="events-layer">
                        <template for:each={timelineEvents} for:item="e">
                            <div class="event-block" key={e.id} style={e.style} data-id={e.id} onclick={navigateToRecord}>
                                <div class="event-title slds-truncate"><strong>{e.subject}</strong></div>
                                <template if:false={e.isCompact}>
                                    <div class="event-time slds-truncate">{e.timeRange}</div>
                                    <template if:true={e.whoName}>
                                        <div class="event-meta slds-truncate">{e.whoName}</div>
                                    </template>
                                    <template if:true={e.location}>
                                        <div class="event-meta slds-truncate">
                                            <lightning-icon icon-name="utility:location" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            {e.location}
                                        </div>
                                    </template>
                                    <div class="event-footer slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                        <template if:true={e.nextBadge}>
                                            <span class="next-badge">{e.nextBadge}</span>
                                        </template>
                                        <template if:true={e.joinUrl}>
                                            <lightning-button label={labels.join} variant="brand" size="small" data-url={e.joinUrl} onclick={handleJoin}></lightning-button>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={hasUpcomingEvents}>
                <div class="upcoming-section slds-m-top_medium">
                    <div class="slds-text-title_caps slds-m-bottom_x-small"><strong>{labels.upcoming}</strong></div>
                    <ul>
                        <template for:each={upcomingEvents} for:item="e">
                            <li class="upcoming-item" key={e.id} style={e.style} data-id={e.id} onclick={navigateToRecord}>
                                <div class="slds-grid slds-grid_align-spread">
                                    <strong class="slds-truncate">{e.subject}</strong>
                                    <span class="slds-text-body_small slds-text-color_weak slds-shrink-none slds-m-left_x-small">{e.day}</span>
                                </div>
                                <div class="slds-text-body_small slds-text-color_weak slds-truncate">{e.timeRange}<template if:true={e.whoName}> &bull; {e.whoName}</template></div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <div class="slds-text-align_center slds-m-top_small">
                <lightning-button label={labels.viewAll} variant="neutral" onclick={navigateToEventHome} class="slds-button_stretch"></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
