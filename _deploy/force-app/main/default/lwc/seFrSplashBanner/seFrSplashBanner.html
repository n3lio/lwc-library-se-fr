<template>
    <div class={rootClass} style={hostStyle}>

        <!-- 1. Waves (Charly's animated blobs) -->
        <template lwc:if={isWaves}>
            <div class="sb-bg sb-waves">
                <div class="sb-wave sb-wave_1"></div>
                <div class="sb-wave sb-wave_2"></div>
            </div>
        </template>

        <!-- 2. Aurora (3 floating colored bands with screen blend) -->
        <template lwc:if={isAurora}>
            <div class="sb-bg sb-aurora">
                <div class="sb-aurora-band sb-aurora-band_1"></div>
                <div class="sb-aurora-band sb-aurora-band_2"></div>
                <div class="sb-aurora-band sb-aurora-band_3"></div>
            </div>
        </template>

        <!-- 3. Mesh gradient (Stripe-style: 4 radial gradients drifting) -->
        <template lwc:if={isMesh}>
            <div class="sb-bg sb-mesh">
                <div class="sb-mesh-blob sb-mesh-blob_1"></div>
                <div class="sb-mesh-blob sb-mesh-blob_2"></div>
                <div class="sb-mesh-blob sb-mesh-blob_3"></div>
                <div class="sb-mesh-blob sb-mesh-blob_4"></div>
            </div>
        </template>

        <!-- 4. Floating orbs (5 blurred circles drifting) -->
        <template lwc:if={isOrbs}>
            <div class="sb-bg sb-orbs">
                <div class="sb-orb sb-orb_1"></div>
                <div class="sb-orb sb-orb_2"></div>
                <div class="sb-orb sb-orb_3"></div>
                <div class="sb-orb sb-orb_4"></div>
                <div class="sb-orb sb-orb_5"></div>
            </div>
        </template>

        <!-- 5. Conic spin (Vercel-style rotating conic gradient) -->
        <template lwc:if={isConic}>
            <div class="sb-bg sb-conic">
                <div class="sb-conic-disc"></div>
                <div class="sb-conic-mask"></div>
            </div>
        </template>

        <!-- 6. Geometric mesh (low-poly SVG with pulsing vertices) -->
        <template lwc:if={isGeometric}>
            <div class="sb-bg sb-geometric">
                <svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="sb-geo-grad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="var(--sb-color-primary)" stop-opacity="0.55"/>
                            <stop offset="100%" stop-color="var(--sb-color-secondary)" stop-opacity="0.4"/>
                        </linearGradient>
                    </defs>
                    <g class="sb-geo-tris">
                        <polygon points="0,0 200,80 0,180" fill="url(#sb-geo-grad)" opacity="0.55"/>
                        <polygon points="0,0 200,80 320,0" fill="var(--sb-color-primary)" opacity="0.35"/>
                        <polygon points="200,80 320,0 460,90" fill="var(--sb-color-secondary)" opacity="0.4"/>
                        <polygon points="200,80 460,90 320,200" fill="url(#sb-geo-grad)" opacity="0.5"/>
                        <polygon points="320,200 460,90 580,180" fill="var(--sb-color-tertiary)" opacity="0.35"/>
                        <polygon points="460,90 580,180 640,40" fill="var(--sb-color-primary)" opacity="0.3"/>
                        <polygon points="640,40 580,180 800,100" fill="var(--sb-color-secondary)" opacity="0.4"/>
                        <polygon points="800,100 800,300 580,180" fill="url(#sb-geo-grad)" opacity="0.5"/>
                        <polygon points="0,180 320,200 200,300 0,300" fill="var(--sb-color-primary)" opacity="0.3"/>
                        <polygon points="320,200 580,180 580,300 200,300" fill="var(--sb-color-secondary)" opacity="0.35"/>
                    </g>
                </svg>
            </div>
        </template>

        <!-- 7. Constellation (drifting points + connecting lines) -->
        <template lwc:if={isConstellation}>
            <div class="sb-bg sb-constellation">
                <svg preserveAspectRatio="xMidYMid slice" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
                    <g class="sb-cons-lines" stroke="currentColor" stroke-width="0.5" opacity="0.4">
                        <line x1="80"  y1="60"  x2="200" y2="120"/>
                        <line x1="200" y1="120" x2="320" y2="80"/>
                        <line x1="320" y1="80"  x2="430" y2="160"/>
                        <line x1="430" y1="160" x2="560" y2="100"/>
                        <line x1="560" y1="100" x2="690" y2="180"/>
                        <line x1="200" y1="120" x2="280" y2="220"/>
                        <line x1="280" y1="220" x2="430" y2="160"/>
                        <line x1="430" y1="160" x2="540" y2="240"/>
                        <line x1="540" y1="240" x2="690" y2="180"/>
                        <line x1="80"  y1="60"  x2="160" y2="200"/>
                        <line x1="160" y1="200" x2="280" y2="220"/>
                    </g>
                    <g class="sb-cons-points" fill="currentColor">
                        <circle cx="80"  cy="60"  r="2.5" class="sb-cons-pulse sb-cons-pulse_1"/>
                        <circle cx="200" cy="120" r="2.5" class="sb-cons-pulse sb-cons-pulse_2"/>
                        <circle cx="320" cy="80"  r="2.5" class="sb-cons-pulse sb-cons-pulse_3"/>
                        <circle cx="430" cy="160" r="3"   class="sb-cons-pulse sb-cons-pulse_1"/>
                        <circle cx="560" cy="100" r="2.5" class="sb-cons-pulse sb-cons-pulse_2"/>
                        <circle cx="690" cy="180" r="2.5" class="sb-cons-pulse sb-cons-pulse_3"/>
                        <circle cx="280" cy="220" r="2.5" class="sb-cons-pulse sb-cons-pulse_2"/>
                        <circle cx="540" cy="240" r="2.5" class="sb-cons-pulse sb-cons-pulse_1"/>
                        <circle cx="160" cy="200" r="2"   class="sb-cons-pulse sb-cons-pulse_3"/>
                    </g>
                </svg>
            </div>
        </template>

        <!-- 8. Animated grid (blueprint pulse + scan line) -->
        <template lwc:if={isGrid}>
            <div class="sb-bg sb-grid">
                <div class="sb-grid-lines"></div>
                <div class="sb-grid-pulse"></div>
                <div class="sb-grid-scan"></div>
            </div>
        </template>

        <!-- Foreground content -->
        <div class="sb-content" style={textStyle}>
            <div class="sb-title">{title}</div>
            <template lwc:if={hasSubtitle}>
                <div class="sb-sub">{subtitle}</div>
            </template>
            <template lwc:if={hasCta}>
                <a class="sb-cta" href={ctaUrl} onclick={handleCtaClick}>{ctaLabel}</a>
            </template>
        </div>
    </div>
</template>
