<template>
    <lightning-card title={resolvedCardTitle} icon-name={cardIcon}>

        <div class="slds-grid slds-gutters slds-p-horizontal_medium slds-m-bottom_medium slds-text-align_center">
            <div class="slds-col">
                <div class="kpi-label">{resolvedKpi1Label}</div>
                <div class="kpi-value">{resolvedKpi1Value}</div>
            </div>
            <div class="slds-col">
                <div class="kpi-label">{resolvedKpi2Label}</div>
                <div class="kpi-value">{resolvedKpi2Value}</div>
            </div>
            <div class="slds-col">
                <div class="kpi-label">{resolvedKpi3Label}</div>
                <div class="kpi-value">{resolvedKpi3Value}</div>
            </div>
        </div>

        <div class="slds-border_bottom slds-m-vertical_small"></div>

        <lightning-layout multiple-rows="true" class="slds-p-around_medium">

            <lightning-layout-item size="12" large-device-size="4" padding="around-small">
                <div class="section-title slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name={categoriesIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                    {resolvedCategoriesTitle}
                </div>
                <template for:each={formattedCategories} for:item="cat">
                    <div key={cat.id} class="slds-m-bottom_small">
                        <div class="slds-grid slds-grid_align-spread bar-label">
                            <span class="slds-truncate slds-m-right_x-small" title={cat.label}>{cat.label}</span>
                            <strong class="slds-shrink-none">{cat.value}%</strong>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style={cat.style}></div>
                        </div>
                    </div>
                </template>
            </lightning-layout-item>

            <lightning-layout-item size="12" large-device-size="4" padding="around-small">
                <div class="section-title slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name={brandsIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                    {resolvedBrandsTitle}
                </div>
                <template for:each={formattedBrands} for:item="brand">
                    <div key={brand.id} class="slds-m-bottom_small">
                        <div class="slds-grid slds-grid_align-spread bar-label">
                            <span class="slds-truncate slds-m-right_x-small" title={brand.label}>{brand.label}</span>
                            <strong class="slds-shrink-none">{brand.value}%</strong>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style={brand.style}></div>
                        </div>
                    </div>
                </template>
            </lightning-layout-item>

            <lightning-layout-item size="12" large-device-size="4" padding="around-small">
                <div class="section-title slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name={storesIcon} size="small" class="slds-m-right_x-small"></lightning-icon>
                    {resolvedStoresTitle}
                </div>
                <template for:each={formattedStores} for:item="store">
                    <div key={store.id} class="slds-m-bottom_small">
                        <div class="slds-grid slds-grid_align-spread bar-label">
                            <span class="slds-truncate slds-m-right_x-small" title={store.label}>{store.label}</span>
                            <strong class="slds-shrink-none">{store.visits} {resolvedStoreVisitsSuffix}</strong>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style={store.style}></div>
                        </div>
                    </div>
                </template>
            </lightning-layout-item>

        </lightning-layout>
    </lightning-card>
</template>
