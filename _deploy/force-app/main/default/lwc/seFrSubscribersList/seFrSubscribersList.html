<template>
    <lightning-card icon-name={cardIcon} title={resolvedCardTitle}>
        <span slot="actions" class="slds-text-body_small slds-text-color_weak">
            {computedSubtitle}
        </span>

        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_medium">
                <lightning-spinner size="small" alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <template if:true={showEmpty}>
            <div class="slds-align_absolute-center slds-p-vertical_large slds-text-color_weak">
                {resolvedEmptyState}
            </div>
        </template>

        <template if:true={hasRows}>
            <ul class="subscriber-list">
                <template for:each={rows} for:item="r">
                    <li key={r.key} class="subscriber-item slds-p-vertical_x-small slds-p-horizontal_small">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <!-- Avatar -->
                            <template if:true={r.hasPhoto}>
                                <div class="avatar avatar-photo slds-m-right_small">
                                    <img src={r.photoUrl} alt={r.name} class="avatar-img" />
                                </div>
                            </template>
                            <template if:false={r.hasPhoto}>
                                <div class="avatar avatar-initials slds-m-right_small" style={r.avatarStyle}>
                                    <template if:true={r.isQueue}>
                                        <lightning-icon icon-name="standard:groups" size="x-small" variant="inverse"></lightning-icon>
                                    </template>
                                    <template if:false={r.isQueue}>
                                        <span class="initials">{r.initials}</span>
                                    </template>
                                </div>
                            </template>

                            <!-- Body -->
                            <div class="slds-col slds-grow body-col">
                                <div class="name-role-line">
                                    <template if:true={r.isClickable}>
                                        <a class="name-link" data-userid={r.userId} onclick={handleNameClick}>{r.name}</a>
                                    </template>
                                    <template if:false={r.isClickable}>
                                        <span class="name-text">{r.name}</span>
                                    </template>
                                    <template if:true={r.hasRole}>
                                        <span class="role-badge">{r.role}</span>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
        </template>

        <!-- Show more / Show less -->
        <template if:true={showToggleButton}>
            <div class="toggle-wrapper slds-p-vertical_xx-small slds-align_absolute-center">
                <lightning-button-icon
                    icon-name={toggleButtonIcon}
                    variant="border-filled"
                    size="small"
                    alternative-text={toggleButtonLabel}
                    onclick={handleToggle}>
                </lightning-button-icon>
            </div>
        </template>
    </lightning-card>
</template>
