<template>
    <lightning-card title={resolvedCardTitle} icon-name={cardIcon}>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text={loadingText} size="small"></lightning-spinner>
        </template>

        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <template if:true={needsMapping}>
                <p class="slds-text-align_center slds-text-color_weak slds-text-body_small">{needsMappingMessage}</p>
            </template>
            <template if:false={needsMapping}>
                <ul class="cm-list">
                    <template for:each={displayChannels} for:item="ch">
                        <li key={ch.key} class="cm-row">
                            <span class="cm-label" title={ch.label}>{ch.label}</span>
                            <lightning-input
                                class="cm-toggle"
                                type="toggle"
                                variant="label-hidden"
                                label={ch.label}
                                name={ch.key}
                                data-field={ch.fieldApiName}
                                data-inverted={ch.inverted}
                                checked={ch.checked}
                                message-toggle-active={resolvedToggleActive}
                                message-toggle-inactive={resolvedToggleInactive}
                                onchange={handleToggleChange}>
                            </lightning-input>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </lightning-card>
</template>
