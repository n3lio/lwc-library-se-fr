# Release notes — curated, user-facing changelog for the site.
# Internal stuff (FlexiPage cleanups, showcase deploy details) is excluded.
# Each entry: version, date (YYYY-MM-DD), title (short), body (one paragraph).

- kind: "roadmap"
  title:
    fr: 🤖 Soumission via connexion d'org (no-zip)
    en: 🤖 Submission via org-connect (no-zip)
  body:
    fr: Vous connectez votre org de démo, vous cochez les composants à offrir à la lib, le site les empaquette pour vous et lance une validation automatique. Plus besoin d’uploader un zip à la main.
    en: Connect your demo org, tick the components you want to share, the site bundles them for you and runs auto-validation. No more zip uploads.

- kind: "roadmap"
  title:
    fr: 🧪 Auto-deploy + check de validité d'une soumission
    en: 🧪 Auto-deploy + validity check on submission
  body:
    fr: À chaque nouvelle soumission, un déploiement automatique sur une org de test détecte les erreurs (composants cassés, dépendances manquantes, schema-unsafe). Un agent MCP guide ensuite le contributeur pour corriger et intégrer proprement à la librairie.
    en: Each new submission triggers an automatic deploy to a sandbox org to catch errors (broken components, missing deps, schema-unsafe). An MCP agent then walks the contributor through fixes and clean library integration.

- kind: "roadmap"
  title:
    fr: 👥 Espace contributeurs
    en: 👥 Contributor space
  body:
    fr: Chaque contributeur aura sa page personnelle pour suivre ses composants, voir les téléchargements et déploiements, gérer les retours utilisateurs, et soumettre de nouveaux composants en quelques clics.
    en: Each contributor will have their own page to track their components, see downloads and deploys, handle user feedback, and submit new components in a few clicks.

- kind: "roadmap"
  title:
    fr: 🏆 Gamification des contributions
    en: 🏆 Contribution gamification
  body:
    fr: Badges, classement des contributeurs, compteurs « impacts » par composant (downloads, deploys, likes). De quoi rendre la contribution gratifiante et visible.
    en: Badges, contributor leaderboard, per-component impact counters (downloads, deploys, likes). To make contributing rewarding and visible.

- kind: "roadmap"
  title:
    fr: 📊 Page admin / pilotage de la lib
    en: 📊 Admin / library steering page
  body:
    fr: Tableau de bord centralisé pour piloter la lib : analytics complets (visites, téléchargements, déploiements, conversions), revue des soumissions et feedbacks, gestion des contributeurs, modération.
    en: Centralized dashboard to steer the lib: full analytics (visits, downloads, deploys, conversions), submission and feedback review, contributor management, moderation.

- version: "2.9"
  date: "2026-05-12"
  title:
    fr: Le site va sur Heroku, déploiement 1-clic à votre org de démo
    en: The site goes on Heroku, 1-click deploy to your demo org
  body:
    fr: Le site est désormais hébergé sur Heroku. Connectez votre org via OAuth, sélectionnez les composants ou un cookbook, déployez en quelques secondes — multi-sélection, bundles, modale de confirmation, suivi de progression et récap persistant après déploiement. Bouton « Voir en live » qui vous ouvre l’org showcase en read-only sans login. Tracking complet de l’usage côté serveur (Postgres) pour piloter la lib. Formulaires Soumettre / Feedback / Contact branchés en base et notifiés par email. Submit avec pièce jointe (.zip ou .txt, 2 MB max).
    en: The site is now hosted on Heroku. Connect your org via OAuth, pick components or a cookbook, deploy in seconds — multi-select, bundles, confirmation modal, progress tracking and a persistent summary after deploy. New "See it live" button drops you in the showcase org read-only with no login. Full server-side usage tracking (Postgres) to steer the lib. Submit / Feedback / Contact forms persisted in DB and notified by email. Submit with attachment (.zip or .txt, 2 MB max).

- version: "2.8"
  date: "2026-05-08"
  title:
    fr: Refonte Prompt Launcher + librairie « manifest-driven »
    en: Prompt Launcher rebuilt + manifest-driven pipeline
  body:
    fr: Le composant <code>seFrPromptLauncher</code> remplace l’ancien chat — il exécute des Salesforce Prompt Templates via les Invocable Actions, contexte record auto-injecté, rendu HTML / Markdown. La librairie passe sur un manifeste central qui dirige README, deck, knowledge base de l’agent et ce site.
    en: The <code>seFrPromptLauncher</code> component replaces the old chat — it runs Salesforce Prompt Templates via Invocable Actions, with auto-injected record context and HTML / Markdown rendering. The library now runs on a central manifest that drives the README, deck, agent knowledge base and this site.

- version: "2.7"
  date: "2026-05-03"
  title:
    fr: 8 composants ajoutés
    en: 8 new components
  body:
    fr: Gros lot de composants génériques et réutilisables, couvrant pipeline, timelines, contacts, kanban, KPIs, fichiers et alertes — <code>seFrPipelineSnapshot</code>, <code>seFrTimelinePhases</code>, <code>seFrContactsCarousel</code>, <code>seFrAccountHealth</code>, <code>seFrKanbanBoard</code>, <code>seFrMetricTile</code>, <code>seFrFilesGallery</code>, <code>seFrAlertsRibbon</code>.
    en: A big batch of generic, reusable components covering pipeline, timelines, contacts, kanban, KPIs, files and alerts — <code>seFrPipelineSnapshot</code>, <code>seFrTimelinePhases</code>, <code>seFrContactsCarousel</code>, <code>seFrAccountHealth</code>, <code>seFrKanbanBoard</code>, <code>seFrMetricTile</code>, <code>seFrFilesGallery</code>, <code>seFrAlertsRibbon</code>.

- version: "2.6"
  date: "2026-04-30"
  title:
    fr: Bilingue FR / EN sur l’ensemble de la lib
    en: Bilingual FR / EN across the board
  body:
    fr: Tous les composants (sauf <code>seFrAgentforceHeader</code>) exposent désormais une prop <code>language</code> avec dictionnaires FR/EN complets. Les valeurs App Builder restent prioritaires — un SE FR peut démo en FR avec quelques labels en allemand sans changer de langue globale.
    en: Every component (except <code>seFrAgentforceHeader</code>) now exposes a <code>language</code> prop with full FR/EN dictionaries. App Builder values still win — a French SE demoing to a German prospect can override individual labels without switching the whole language.

- version: "2.4"
  date: "2026-04-29"
  title:
    fr: My Events — refonte sidebar
    en: My Events refonte
  body:
    fr: Layout sidebar compact, événements qui se chevauchent affichés côté à côte (style Google Calendar), ligne « now » live, bouton Join pour les liens Zoom / Teams / Meet / WebEx.
    en: Compact sidebar layout, side-by-side overlapping events (Google Calendar style), live "now" line, Join button for Zoom / Teams / Meet / WebEx links.

- version: "2.0"
  date: "2026-04-24"
  title:
    fr: Première version publique
    en: Initial release
  body:
    fr: 11 composants extraits de la démo « Coup de Pâtes » (B2B bakery) et génériques — bricks industry-neutral.
    en: 11 components extracted from the "Coup de Pâtes" B2B bakery demo, generalized into industry-neutral building blocks.
