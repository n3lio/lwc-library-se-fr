# Cookbook recipes — curated bundles of components for typical demo scenarios.
# Each recipe references components by apiName. The site cross-validates that
# each apiName exists in the manifest at build time.
#
# Format:
# - id: short-slug
#   emoji: <emoji>
#   title: <name>
#   description: <one-line desc>
#   primaryPersona: <one of the manifest's ALLOWED_PERSONAS>
#   components: [list of seFr* apiNames]

- id: account-360
  emoji: 🏢
  title: Account 360°
  description: Drop-in record page for B2B Sales — highlights, health gauge, pipeline, activity timeline, contacts carousel, related records and AI recommendations.
  primaryPersona: Sales
  components:
    - seFrRecordHighlights
    - seFrAccountHealth
    - seFrPipelineSnapshot
    - seFrActivityFeed
    - seFrContactsCarousel
    - seFrRelatedRecordCard
    - seFrSmartRecommendations
    - seFrAccountStrategyPlan
    - seFrRevenueDashboard
    - seFrCustomerOrders
    - seFrRecordActions

- id: field-sales-cockpit
  emoji: 🚗
  title: Field Sales cockpit
  description: Mobile-first Home page for reps in the field — priority accounts, map, agenda, tasks, voice notes and KPIs.
  primaryPersona: FieldSales
  components:
    - seFrFieldRepHome
    - seFrNearbyAccountsMap
    - seFrTerritoryMap
    - seFrMyEvents
    - seFrMyTasks
    - seFrVoiceNoteTaker
    - seFrKpiLauncher

- id: service-desk
  emoji: 📞
  title: Service desk
  description: Case-centric record page with service contracts, account team, order history, kanban, alerts and smart actions.
  primaryPersona: Service
  components:
    - seFrAlertsRibbon
    - seFrServiceContracts
    - seFrSubscribersList
    - seFrCustomerOrders
    - seFrOrderSummary
    - seFrKanbanBoard
    - seFrSmartRecommendations

- id: agentforce-demo
  emoji: 🤖
  title: Agentforce demo
  description: Showcase page tuned for AI-driven scenarios — hero banner, prompt launcher, and recommendations.
  primaryPersona: Agents
  components:
    - seFrAgentforceHeader
    - seFrPromptLauncher
    - seFrSmartRecommendations
    - seFrSplashBanner

- id: marketing-360
  emoji: 🎯
  title: Marketing 360°
  description: Contact-centric page with engagement history, consent management, segment membership and signals.
  primaryPersona: Marketing
  components:
    - seFrActiveSegments
    - seFrConsentManager
    - seFrEngagementHistory
    - seFrActivityFeed
    - seFrCustomerSalesSummary
    - seFrSubscribersList

- id: retail-visit-workflow
  emoji: 🏪
  title: Retail Execution — Visit workflow
  description: Full store-visit lifecycle on the Visit record page — check-in/out, action-plan checklist, product and shelf-space survey, shelf photo compliance with Agentforce analysis, restock order and AI visit summary.
  primaryPersona: Retail
  components:
    - seFrVisitCheckIn
    - seFrVisitPlan
    - seFrVisitProductCheck
    - seFrVisitShelfSpace
    - seFrVisitShelfCompliance
    - seFrVisitQuickOrder
    - seFrVisitRestockOrder
    - seFrVisitSummaryAI
    - seFrVoiceNoteTaker
    - seFrFilesGallery

- id: retail-exec-home
  emoji: 🛒
  title: Retail Execution — Rep home & account
  description: Retail rep's day — Home with agenda, tasks and nearby stores, business-card/lead capture, and the Account page with visit kanban, quick orders and key-account actions.
  primaryPersona: Retail
  components:
    - seFrFieldRepHome
    - seFrMyEvents
    - seFrMyTasks
    - seFrNearbyAccountsMap
    - seFrBusinessCardScanner
    - seFrLeadFirstTouch
    - seFrVisitKanban
    - seFrVisitQuickOrder
    - seFrRecordActions

- id: telesales-cockpit
  emoji: ☎️
  title: Telesales cockpit
  description: Inside-sales Home and order desk — KPIs, live cases and orders, kanban, order entry and customer history.
  primaryPersona: Telesales
  components:
    - seFrTelesalesRepHome
    - seFrKpiLauncher
    - seFrKanbanBoard
    - seFrOrderEntry
    - seFrCustomerOrders
    - seFrMyTasks
    - seFrMetricTile

- id: opportunity-pipeline
  emoji: 📈
  title: Opportunity & pipeline
  description: Opportunity record page — sales-cycle timeline, highlights, pipeline snapshot, contact and related-record cards, recommendations.
  primaryPersona: Sales
  components:
    - seFrRecordHighlights
    - seFrTimelinePhases
    - seFrPipelineSnapshot
    - seFrContactCard
    - seFrRelatedRecordCard
    - seFrRecordActions
    - seFrSmartRecommendations
    - seFrServiceContracts

- id: full-pack
  emoji: 📦
  title: Full pack
  description: All components in one go — for when you want everything pre-loaded.
  primaryPersona: All
  components: ALL
